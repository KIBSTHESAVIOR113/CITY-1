name: Build LostCities-Paper JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and patch source
        run: |
          unzip -o lostcities-paper-putaran-10.zip -d project
          python3 - << 'EOF'
          from pathlib import Path
          def patch(path, old, new):
              p = Path(path)
              t = p.read_text(encoding="utf-8")
              if old in t:
                  p.write_text(t.replace(old, new), encoding="utf-8")

          patch("project/build.gradle.kts", '(property("javaVersion") as String).toInt()', '25')
          patch("project/gradle.properties", "paperApiVersion=26.3-R0.1-SNAPSHOT", "paperApiVersion=26.3.build.+")
          patch("project/src/main/java/mcjty/lostcities/paper/util/BoundedCache.java",
                "Map.Entry<K, Entry<V>>", "Map.Entry<K, BoundedCache.Entry<V>>")
          patch("project/src/test/java/mcjty/lostcities/paper/assets/AssetLoaderTest.java",
                'Files.writeString(partsDir.resolve("valid.json"), "{"xsize":16,"zsize":16,"slices":[["................"]]}");',
                'Files.writeString(partsDir.resolve("valid.json"), "{\\"xsize\\":16,\\"zsize\\":16,\\"slices\\":[[\\"................\\"]]}");')
          patch("project/src/test/java/mcjty/lostcities/paper/config/LostCityProfileParityTest.java",
                'JsonObject obj = JsonParser.parseString("{"groundLevel": 999, "buildingChance": 5.0}").getAsJsonObject();',
                'JsonObject obj = JsonParser.parseString("{\\"groundLevel\\": 999, \\"buildingChance\\": 5.0}").getAsJsonObject();')
          patch("project/src/test/java/mcjty/lostcities/paper/network/NetworkAndPersistenceTest.java",
                'Files.writeString(tmp.resolve("highways.json"), "{"formatVersion": 2, "data": { TRUNCATED");',
                'Files.writeString(tmp.resolve("highways.json"), "{\\"formatVersion\\": 2, \\"data\\": { TRUNCATED");')
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin JAR
        working-directory: project
        run: gradle clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LostCities-Paper-JAR
          path: project/build/libs/*.jar
