name: Build LostCities-Paper JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and patch build config
        run: |
          unzip -o lostcities-paper-putaran-10.zip -d project
          sed -i 's/(property("javaVersion") as String).toInt()/25/g' project/build.gradle.kts
          sed -i 's/paperApiVersion=26.3-R0.1-SNAPSHOT/paperApiVersion=26.3.build.+/g' project/gradle.properties
          sed -i 's/Map\.Entry<K, Entry<V>>/Map.Entry<K, BoundedCache.Entry<V>>/g' project/src/main/java/mcjty/lostcities/paper/util/BoundedCache.java

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin JAR
        working-directory: project
        run: gradle clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LostCities-Paper-JAR
          path: project/build/libs/*.jar
